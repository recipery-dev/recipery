<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline - Recipery</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf9f7;
    color: #1c1a15;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #16140f; color: #f2f0ea; }
  }
  main { max-width: 22rem; padding: 1.5rem; }
  h1 { font-size: 1.125rem; font-weight: 700; margin: 0 0 0.5rem; }
  p { font-size: 0.9rem; opacity: 0.7; margin: 0; line-height: 1.5; }
</style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been visited yet, so it isn't available offline. Reconnect and try again.</p>
  </main>
</body>
</html>
