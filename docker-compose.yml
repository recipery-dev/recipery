services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: recipery
      S3_ACCESS_KEY: recipery
      S3_SECRET_KEY: recipery123
      # Sharing a bucket with other apps? Point this at a subdirectory
      # instead of a dedicated bucket, e.g. S3_PREFIX: recipery
      # S3_PREFIX: ""
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: recipery
      MINIO_ROOT_PASSWORD: recipery123
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 recipery recipery123 &&
      mc mb --ignore-existing local/recipery
      "
